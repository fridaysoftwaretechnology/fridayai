<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Prevents unwanted zooming on Android when tapping the input field -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friday</title>
    <style>
        /* CSS Variables for Light & Dark Themes */
        :root {
            --bg-main: #f0f2f5;
            --bg-header: #ffffff;
            --bg-footer: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #1c1e21;
            --text-secondary: #65676b;
            --accent-color: #0084ff;
            --accent-hover: #0073e6;
            --msg-user-bg: #0084ff;
            --msg-user-text: #ffffff;
            --msg-bot-bg: #ffffff;
            --msg-bot-text: #1c1e21;
            --border-color: #e4e6eb;
            --danger-color: #e41e3f;
        }

        body.dark-mode {
            --bg-main: #121212;
            --bg-header: #1e1e1e;
            --bg-footer: #1e1e1e;
            --bg-input: #2c2c2c;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --accent-color: #2e89ff;
            --accent-hover: #4599ff;
            --msg-user-bg: #2e89ff;
            --msg-user-text: #ffffff;
            --msg-bot-bg: #262626;
            --msg-bot-text: #e4e6eb;
            --border-color: #333333;
            --danger-color: #ff4d6d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* Header Section */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-info p {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: capitalize;
            margin-top: 2px;
        }

        /* Theme Toggle Button */
        .dark-theme {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            user-select: none;
            border: 1px solid var(--border-color);
            transition: transform 0.15s ease;
        }

        .dark-theme:active {
            transform: scale(0.92);
        }



        /* Chat Area */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        /* Message Bubbles */
        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.2s ease-out;
        }

        .message-wrapper.user {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-wrapper.bot {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user .message-bubble {
            background-color: var(--msg-user-bg);
            color: var(--msg-user-text);
            border-bottom-right-radius: 4px;
        }

        .bot .message-bubble {
            background-color: var(--msg-bot-bg);
            color: var(--msg-bot-text);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .chat-image {
            max-width: 100%;
            max-height: 280px;
            border-radius: 12px;
            object-fit: cover;
            display: block;
        }

        .chat-audio {
            max-width: 230px;
            height: 36px;
        }

        .timestamp {
            font-size: 0.68rem;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 0 4px;
        }

        /* Media Attachment Preview Bar */
        #attachmentPreview {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background-color: var(--bg-footer);
            border-top: 1px solid var(--border-color);
            font-size: 0.85rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        #attachmentPreview.active {
            display: flex;
        }

        .preview-content {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        #previewThumb {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            display: none;
        }

        #removeAttachmentBtn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Footer / Input Area */
        footer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background-color: var(--bg-footer);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn.recording {
            background-color: var(--danger-color);
            color: #ffffff;
            border-color: var(--danger-color);
            animation: pulse 1.2s infinite;
        }

        .icon-btn.send-mode {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        #message {
            flex: 1;
            min-width: 0;
            padding: 11px 14px;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #message:focus {
            border-color: var(--accent-color);
        }

        #message::placeholder {
            color: var(--text-secondary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(228, 30, 63, 0.5);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(228, 30, 63, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(228, 30, 63, 0);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-brand">
            <img src="fridayAi.png" alt="Friday AI Logo" class="header-logo" onerror="this.style.display='none'">
            <div class="header-info">
                <h3>Friday AI</h3>
                <p>powered by friday software technology park</p>
            </div>
        </div>
        <div class="dark-theme" id="themeToggle" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
            🌙
        </div>
        <div class="dark-theme" id="profileBtn" title="Visit Developer Profile">
            🧠
        </div>
    </header>

    <main id="chatContainer">
        <!-- Initial Welcome Message -->
        <div class="message-wrapper bot">
            <div class="message-bubble">
                <span>Hello! I am Friday AI. You can send text, upload images, or record voice notes!</span>
            </div>
            <span class="timestamp">Just now</span>
        </div>
    </main>

    <!-- Attachment Preview Strip -->
    <div id="attachmentPreview">
        <div class="preview-content">
            <img id="previewThumb" alt="Selected preview">
            <span id="previewLabel"></span>
        </div>
        <button id="removeAttachmentBtn" type="button" title="Remove attachment">✕</button>
    </div>

    <footer>
        <!-- Hidden File Input for Images -->
        <input type="file" id="imageInput" accept="image/*" hidden>

        <!-- Upload Image Button -->
        <button id="imageBtn" class="icon-btn" type="button" title="Attach Image" aria-label="Attach Image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
        </button>

        <input type="text" id="message" placeholder="Type message or record..." autocomplete="off">

        <!-- Dynamic Action Button: Voice Recorder by default, transforms to Send Icon when input has text -->
        <button id="micSendBtn" class="icon-btn" type="button" title="Record Voice Message" aria-label="Voice Record or Send">
            <!-- Mic Icon (Default) -->
            <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
            <!-- Send Icon (Hidden by default, shown when typing) -->
            <svg id="sendIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </footer>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('message');
        const micSendBtn = document.getElementById('micSendBtn');
        const micIcon = document.getElementById('micIcon');
        const sendIcon = document.getElementById('sendIcon');
        const themeToggle = document.getElementById('themeToggle');
        const profileBtn = document.getElementById('profileBtn');

        const imageInput = document.getElementById('imageInput');
        const imageBtn = document.getElementById('imageBtn');

        const attachmentPreview = document.getElementById('attachmentPreview');
        const previewThumb = document.getElementById('previewThumb');
        const previewLabel = document.getElementById('previewLabel');
        const removeAttachmentBtn = document.getElementById('removeAttachmentBtn');

        // Global Configuration & Instructions fetched dynamically
        let appConfig = { apiKey: "", model: "gemini-3.1-flash-lite" };
        let customInstructions = "You are Friday AI, an intelligent assistant powered by Friday Software Technology Park.";

        // Application State
        let attachedMedia = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // Fetch config.json and instructions.txt upon startup
        async function loadAppConfig() {
            try {
                const configRes = await fetch('config.json');
                if (configRes.ok) {
                    const cfg = await configRes.json();
                    if (cfg.model) appConfig.model = cfg.model;
                    // if (cfg.apiKey) appConfig.apiKey = cfg.apiKey;
                    if (cfg.a && cfg.p && cfg.i) appConfig.apiKey = cfg.a + cfg.p + cfg.i;
                    
                }
            } catch (e) {
                console.warn("Could not load config.json:", e);
            }

            try {
                const instRes = await fetch('instructions.txt');
                if (instRes.ok) {
                    const text = await instRes.text();
                    if (text.trim()) {
                        customInstructions = text.trim();
                    }
                }
            } catch (e) {
                console.warn("Could not load instructions.txt:", e);
            }
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function appendMessage({ text = "", imageUrl = null, audioUrl = null }, sender) {
            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper', sender);

            const bubble = document.createElement('div');
            bubble.classList.add('message-bubble');

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = "Uploaded image";
                img.classList.add('chat-image');
                bubble.appendChild(img);
            }

            if (audioUrl) {
                const audio = document.createElement('audio');
                audio.src = audioUrl;
                audio.controls = true;
                audio.classList.add('chat-audio');
                bubble.appendChild(audio);
            }

            if (text) {
                const textEl = document.createElement('span');
                textEl.textContent = text;
                bubble.appendChild(textEl);
            }

            const time = document.createElement('span');
            time.classList.add('timestamp');
            time.textContent = getCurrentTime();

            wrapper.appendChild(bubble);
            wrapper.appendChild(time);
            chatContainer.appendChild(wrapper);

            chatContainer.scrollTop = chatContainer.scrollHeight;
            return wrapper;
        }

        function clearAttachment() {
            attachedMedia = null;
            imageInput.value = '';
            previewThumb.src = '';
            previewThumb.style.display = 'none';
            previewLabel.textContent = '';
            attachmentPreview.classList.remove('active');
        }

        function updateActionState() {
            const hasText = messageInput.value.trim().length > 0;
            if (hasText) {
                micIcon.style.display = 'none';
                sendIcon.style.display = 'block';
                micSendBtn.classList.add('send-mode');
                micSendBtn.title = "Send Message";
            } else {
                sendIcon.style.display = 'none';
                micIcon.style.display = 'block';
                micSendBtn.classList.remove('send-mode');
                micSendBtn.title = "Record Voice Message";
            }
        }

        messageInput.addEventListener('input', updateActionState);

        async function callGeminiAPI(userText, media) {
            if (!appConfig.apiKey) {
                return { text: "Error: API key not found in config.json." };
            }

            try {
                const parts = [];
                const promptText = userText
                    ? `${customInstructions}\n\nUser: ${userText}`
                    : `${customInstructions}\n\nUser: Please listen to the attached voice message and reply.`;

                parts.push({ text: promptText });

                if (media) {
                    parts.push({
                        inline_data: {
                            mime_type: media.mimeType,
                            data: media.base64
                        }
                    });
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${appConfig.model}:generateContent?key=${appConfig.apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: "user", parts: parts }] })
                });

                const data = await response.json();
                if (!response.ok) {
                    return { text: `Error: ${data.error?.message || "API request failed."}` };
                }

                const candidateParts = data.candidates?.[0]?.content?.parts || [];
                let replyText = "";
                for (const part of candidateParts) {
                    if (part.text) replyText += (replyText ? "\n" : "") + part.text;
                }

                return { text: replyText || "Sorry, I couldn't process that request right now." };
            } catch (error) {
                console.error("Gemini API Error:", error);
                return { text: "Network error. Please check your connection." };
            }
        }

        imageBtn.addEventListener('click', () => imageInput.click());

        imageInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = () => {
                const dataUrl = reader.result;
                attachedMedia = {
                    type: 'image',
                    mimeType: file.type || 'image/jpeg',
                    base64: dataUrl.split(',')[1],
                    dataUrl: dataUrl,
                    name: file.name
                };

                previewThumb.src = dataUrl;
                previewThumb.style.display = 'block';
                previewLabel.textContent = `Image: ${file.name}`;
                attachmentPreview.classList.add('active');
            };
            reader.readAsDataURL(file);
        });

        // Cross-platform Voice Recording
        async function startVoiceRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Microphone API is not supported in this browser context.");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];

                let options = {};
                const possibleTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg', 'audio/mp4', 'audio/aac'];
                for (let t of possibleTypes) {
                    if (MediaRecorder.isTypeSupported(t)) {
                        options = { mimeType: t };
                        break;
                    }
                }

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(track => track.stop());

                    const recordedMimeType = mediaRecorder.mimeType || 'audio/webm';
                    const audioBlob = new Blob(audioChunks, { type: recordedMimeType });
                    const reader = new FileReader();

                    reader.onloadend = () => {
                        const dataUrl = reader.result;
                        let cleanMime = recordedMimeType.split(';')[0];
                        if (!cleanMime) cleanMime = 'audio/webm';

                        attachedMedia = {
                            type: 'audio',
                            mimeType: cleanMime,
                            base64: dataUrl.split(',')[1],
                            dataUrl: dataUrl,
                            name: 'Voice Message'
                        };

                        previewThumb.style.display = 'none';
                        previewLabel.textContent = "🎤 Voice message ready to send";
                        attachmentPreview.classList.add('active');
                    };
                    reader.readAsDataURL(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                micSendBtn.classList.add('recording');
            } catch (err) {
                console.error("Microphone Access Error:", err);
                alert("Microphone permission denied or unavailable.");
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micSendBtn.classList.remove('recording');
            }
        }

        micSendBtn.addEventListener('click', async () => {
            const hasText = messageInput.value.trim().length > 0;

            if (hasText || attachedMedia) {
                handleSend();
            } else {
                if (isRecording) {
                    stopVoiceRecording();
                } else {
                    await startVoiceRecording();
                }
            }
        });

        removeAttachmentBtn.addEventListener('click', clearAttachment);

        async function handleSend() {
            if (isRecording) {
                stopVoiceRecording();
            }

            const text = messageInput.value.trim();
            if (!text && !attachedMedia) return;

            const currentMedia = attachedMedia;

            appendMessage({
                text: text,
                imageUrl: currentMedia?.type === 'image' ? currentMedia.dataUrl : null,
                audioUrl: currentMedia?.type === 'audio' ? currentMedia.dataUrl : null
            }, 'user');

            messageInput.value = '';
            clearAttachment();
            updateActionState();
            messageInput.focus();

            const loadingMsg = appendMessage({ text: "Thinking..." }, 'bot');
            const botReply = await callGeminiAPI(text, currentMedia);

            loadingMsg.remove();
            appendMessage({ text: botReply.text }, 'bot');
        }

        messageInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                handleSend();
            }
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });

        profileBtn.addEventListener('click', () => {
            window.location.href = "https://fridaysoftwaretechnology.github.io/admin/";
        });

        window.addEventListener('resize', () => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        loadAppConfig();
    </script>
</body>

</html>
